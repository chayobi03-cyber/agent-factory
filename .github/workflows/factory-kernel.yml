name: Factory Kernel Regression

on:
  push:
    branches: [main, p0/**]
  pull_request:
    branches: [main]

jobs:
  kernel-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pytest pyyaml
      - name: Capture CI execution identity
        run: |
          cat > ci-execution-identity.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "github_sha": "${GITHUB_SHA}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "head_ref": "${{ github.head_ref || github.ref_name }}",
            "ref": "${GITHUB_REF}"
          }
          EOF
      - name: CER Resume RC-01..RC-08
        run: python3 scripts/validate_session_resume.py 2>&1 | tee resume.stdout.txt
      - name: Factory Demo E2E
        run: python3 scripts/factory_demo.py --scenario all --json 2>&1 | tee factory-demo.stdout.json
      - name: Deterministic Kernel Harness
        run: python3 scripts/run_harness.py --json 2>&1 | tee factory-harness.stdout.json
      - name: OPRO Baseline E2E
        run: python3 scripts/opro_baseline.py --json 2>&1 | tee opro-baseline.stdout.json
      - name: Unit and Kernel Regression
        run: pytest -q 2>&1 | tee pytest.stdout.txt
      - name: Publish machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-kernel-machine-evidence
          path: |
            ci-execution-identity.json
            resume.stdout.txt
            factory-demo.stdout.json
            factory-harness.stdout.json
            opro-baseline.stdout.json
            pytest.stdout.txt
