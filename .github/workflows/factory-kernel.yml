name: Factory Kernel Regression

on:
  push:
    branches: [main, p0/**]
  pull_request:
    branches: [main]

jobs:
  kernel-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Factory Demo E2E
        run: python3 scripts/factory_demo.py --scenario all --json | tee factory-demo.stdout.json
      - name: Deterministic Kernel Harness
        continue-on-error: true
        run: python3 scripts/run_harness.py --json | tee factory-harness.stdout.json
      - name: OPRO Baseline E2E
        run: python3 scripts/opro_baseline.py --json | tee opro-baseline.stdout.json
      - name: Unit and Kernel Regression
        run: pytest -q
      - name: Publish machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-kernel-machine-evidence
          path: |
            factory-demo.stdout.json
            factory-harness.stdout.json
            opro-baseline.stdout.json
