schema_id: session_state
schema_version: 1.0.0
purpose: Canonical machine-readable session continuation pointer for CER-governed work sessions
properties:
  state_version:
    type: integer
    required: true
  session_id:
    type: string
    required: true
  phase:
    type: string
    required: true
  gate:
    type: string
    required: true
  repository:
    type: string
    required: true
    const: chayobi03-cyber/agent-factory
  working_branch:
    type: string
    required: true
  audited_baseline_sha:
    type: string|null
    required: true
  task_id:
    type: string
    required: true
  current_task:
    type: string
    required: true
  last_completed:
    type: list[string]
    required: true
  current_focus:
    type: list[string]
    required: true
  next_action:
    type: list[string]
    required: true
  blocked_until:
    type: list[string]
    required: true
  forbidden:
    type: list[string]
    required: true
  handoff:
    type: string
    required: true
  updated_at_utc:
    type: datetime
    required: true
rules:
  - name: no_self_referential_head
    description: Current Git HEAD is resolved from Git and is not stored as a self-referential field in the same state commit.
  - name: baseline_immutable
    description: audited_baseline_sha may not be silently replaced.
  - name: state_is_not_evidence
    description: State values do not constitute execution evidence or audit verification.
  - name: progressive_disclosure
    description: Resume loads state first, then required handoff/evidence only.
  - name: fail_closed_resume
    description: Branch, baseline, evidence, or constraint mismatch requires REVIEW_REQUIRED or BLOCKED.
