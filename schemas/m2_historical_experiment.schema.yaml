schema_id: m2_historical_experiment
schema_version: 1.0.0
purpose: Machine-readable contract for M2 historical integration, PIT-safe replay, partition identity, and evidence gating

properties:
  experiment_id:
    type: string
    required: true
  case_id:
    type: string
    required: true
  source:
    type: mapping
    required: true
    properties:
      provider:
        type: string
        required: true
      dataset_id:
        type: string
        required: true
      source_version:
        type: string
        required: true
      source_hash:
        type: sha256
        required: true
  observation:
    type: mapping
    required: true
    properties:
      observation_time:
        type: datetime
        required: true
      value:
        type: string|number
        required: true
      unit:
        type: string
        required: true
  pit:
    type: mapping
    required: true
    properties:
      availability_time:
        type: datetime
        required: true
      vintage_id:
        type: string
        required: true
      vintage_as_of:
        type: datetime
        required: true
      cutoff_time:
        type: datetime
        required: true
  payload:
    type: mapping
    required: true
    properties:
      raw_payload_sha256:
        type: sha256
        required: true
      normalized_record_sha256:
        type: sha256
        required: true
  transform:
    type: mapping
    required: true
    properties:
      version:
        type: string
        required: true
      rule_id:
        type: string
        required: true
  replay:
    type: mapping
    required: true
    properties:
      replay_key:
        type: sha256
        required: true
      deterministic:
        type: boolean
        required: true
  partition:
    type: mapping
    required: true
    properties:
      partition_id:
        type: string
        required: true
      train_start:
        type: date
        required: true
      train_end:
        type: date
        required: true
      validation_start:
        type: date
        required: true
      validation_end:
        type: date
        required: true
      oos_start:
        type: date
        required: true
      oos_end:
        type: date
        required: true
  evidence:
    type: mapping
    required: true
    properties:
      artifact_id:
        type: string|null
        required: true
      execution_sha:
        type: sha1|null
        required: true
      execution_status:
        type: enum[NOT_EXECUTED, EXECUTED, VERIFIED]
        required: true
  gate:
    type: mapping
    required: true
    properties:
      status:
        type: enum[PASS, REVIEW_REQUIRED, BLOCKED]
        required: true
      reason:
        type: string
        required: true

rules:
  - name: observation_vs_availability
    description: observation_time does not establish PIT usability; availability_time is the operative PIT boundary.
  - name: pit_cutoff
    description: availability_time and vintage_as_of must be on or before cutoff_time.
  - name: no_future_information
    description: No input observation or vintage may occur after the experiment cutoff.
  - name: disjoint_partitions
    description: Train, validation, and OOS intervals for a case must not overlap.
  - name: provenance_identity
    description: Same numeric value with different provenance is not the same evidence.
  - name: transform_version_binding
    description: Replay identity changes when transformation version changes.
  - name: evidence_required
    description: Historical-performance gates cannot pass without verified execution evidence and a bound artifact.
  - name: synthetic_fixture_boundary
    description: Synthetic fixture evidence cannot satisfy the historical-performance gate.
  - name: fail_closed
    description: Missing, stale, mismatched, or contradictory evidence yields REVIEW_REQUIRED or BLOCKED, never PASS.
