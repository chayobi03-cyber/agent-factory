current_focus:
  - RE_POC acceptance targets now say what is gated and what is not - three are gated, four carry the measured position and a pointer to the decision that is still open. The single 0.90 abstention figure is replaced by per-band targets that match the gate, pinned by test to the kernel's band vocabulary
  - the handover blockers are cleared and the two questions that need the owner are registered rather than answered - D-15 on five unmeasured acceptance targets and D-16 on a PoC target the kernel is forbidden to meet
  - the day-one handover path works on documents this repository has never seen - `re_demo.py --corpus DIR --benchmark PATH` scores a foreign corpus and refuses a benchmark that does not match it, and `calibrate_retrieval.py` answers `unverified` rather than green when it cannot measure a constant. Rehearsed end to end on an out-of-tree corpus
  - Claude Code and Gemini CLI read the same instructions - `docs/AGENT_CONTEXT.md` is the only body, `CLAUDE.md` and `GEMINI.md` each `@`-import it, and tests/test_agent_context.py fails if either grows a body of its own or if the identity table drifts from state
  - the handoff's local verification block now runs unchanged in a Claude Code web session. `.claude/hooks/session-start.sh` installs pytest and exports AGENTFACTORY_TARGET_BRANCH from state.working_branch, so the context guard, resume and session-state validators resolve the trunk from a `claude/*` checkout instead of exiting 2
  - the answer path is honest about itself now - it cites the evidence that answers the claim, its confidence is IDF coverage rather than a score pinned at 1.0 by normalisation, and it tells the reader when a cited document is also in evidence at another revision
  - routing works across all six domains at once - `scripts/run_domain.py --query "..."` with no --domain picks the domain, refuses, or refers to a person. 30/32 on the routing benchmark with out-of-scope refusal at 6/6
  - six domains ship ready for documents - re, thermal, structural, battery, manufacturing, firmware. Each has a policy and a small example corpus so `scripts/run_domain.py --domain <d> --corpus domains/<d>/examples` answers a real question on a fresh clone
  - ready for documents in any domain, not only RE: domains/<id>/domain_pack.yaml plus a folder of JSON, queried with scripts/run_domain.py. See docs/ADDING_A_DOMAIN.md
  - HOLDING for the real RE corpus. Every PoC corpus and benchmark target is met against synthetic documents; further accuracy tuning against them would be fitting to prose this repository wrote about itself
  - hold the trunk on `main` now that the divergent default branch is folded in
current_risk:
  - four retrieval-quality defects are measured and unfixed (OPEN_DECISIONS D-14, final section): the hybrid blend contributes 6.5:1 in BM25's favour and is close to a no-op where RRF would not be; chunking has 0 percent overlap and splits mid-sentence on a semicolon, producing fragments that are meaningless when quoted; there is no de-duplication of near-identical fragments; and there is no alias table, so adding "equipment under test" to a query changes which revision comes back. All four should be measured against the real corpus rather than fitted to this one
  - nothing decides which revision of a document applies. The verifier names the conflict and the reader is told, but whether a query should prefer the newest revision, return both, or refer to a person when the question carries no time scope is a working rule for how RE documents are managed - and revision_id carries no supersession metadata to decide it from. Needs the internal handover
  - routing thresholds are fitted to the example corpora exactly as the retrieval thresholds are fitted to the synthetic RE corpus. MINIMUM_SCORE 0.15 sits between the highest out-of-scope score measured (0.102) and the lowest in-scope one (0.191), and a test asserts that band so the constant cannot drift out of its evidence - but both it and DECISIVE_MARGIN must be re-derived when real corpora of markedly different sizes are loaded together
  - routing picks the corpus and says nothing about whether the answer from it is right. A question routed correctly to a domain whose corpus cannot answer it still reaches the claim verifier and the CER gate and is still refused there; the two mechanisms are independent and both run, but neither covers the other
  - near-miss abstention is 4/8 and no lexical statistic fixes it - eight retrieval-side and five verification-side statistics were scored, and the claim verifier that was expected to resolve it was built and measured as not the fix (OPEN_DECISIONS D-11); a semantic retrieval method is now the only remaining option, and until it lands the pack answers a question it should refuse half the time in that class. The verifier does name the unanswered part of the question in `unsupported_terms`, so the gap reaches a reviewer rather than passing silently
  - the two remaining retrieval constants are still corpus-scale dependent: _COVERAGE_FLOOR 0.12 and _UNSEEN_TERM_CEILING 0.35 were re-derived at 108 fragments / 159 cases, which is the right scale for now but not the PoC end state; re-run the sweeps in tests/test_re_retrieval_stability.py when the corpus changes materially
  - the corpus is synthetic. D-08 keeps the repository public, so real RE reports and CISPR text cannot be committed; every acceptance number is measured against documents written for this repository. An out-of-tree corpus can now be loaded, but a benchmark measured against one is not re-derivable from the commit SHA - the run records the corpus origin and digest so the gap is visible rather than silent
  - retrieval_policy.allowed_modes still lists vector, graph and agentic and names a cross_encoder reranker, none of which exist; selecting one now raises rather than silently returning the hybrid, but the declaration itself is unresolved (OPEN_DECISIONS D-12)
  - Evidence Recall@10 is the stated PoC acceptance target and is insensitive to the retrieval method - every blend from pure trigram to pure BM25 scores 0.914; R@1 and MRR are what actually discriminate, and the target may need restating against one of them
  - the acceptance margin is thin. Gated on the earned figure (0.906 excluding 11 self-answering cases) the retriever clears the 0.90 target by 0.006, which is one case. The headline 0.914 reads more comfortable than the system is
  - the Context Guard compares `git branch --show-current` to EXPECTED_BRANCH, so it fails on any local feature-branch checkout; local verification currently requires naming the checkout after the trunk, which is friction the base-ref fix removed only for CI (OPEN_DECISIONS D-02)
next_action:
  - settle at handover how document revisions are managed - does a retest supersede the test, and can the corpus carry that as metadata? Until then a query answered from one revision while another is in evidence is flagged to the reader and nothing more (OPEN_DECISIONS D-14)
  - when two real corpora of very different sizes are loaded together, re-derive MINIMUM_SCORE and DECISIVE_MARGIN with scripts/routing_benchmark.py against a routing benchmark written for them. The shipped values are fitted to corpora of 3 documents against RE's 30
  - for any domain - drop documents in a folder, copy domains/thermal/domain_pack.yaml, then run scripts/calibrate_retrieval.py before trusting an accuracy number. The four thresholds default to values fitted to synthetic RE documents and carry no authority over another corpus
  - on the day the real RE documents land - run `python3 scripts/calibrate_retrieval.py --corpus <DIR> --benchmark <CASES>`; it re-derives all four corpus-fitted constants and exits non-zero if any shipped value no longer fits. Do this BEFORE trusting any benchmark number measured against the new corpus
  - author a benchmark for the real corpus. The synthetic one names DOC-RE-* identifiers and the calibration tool refuses a benchmark whose expected documents are absent, which is the intended guard rather than an obstacle
  - then revisit OPEN_DECISIONS D-11 with real vocabulary breadth, and D-12 with whatever D-11 turns out to cost
  - D-12 options A, B and D go to comparative trial on the real corpus using scripts/calibrate_retrieval.py; option C is closed

